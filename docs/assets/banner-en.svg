<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DSH Desktop Portable — portable DeepSeek Harness for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1022"/>
      <stop offset="0.55" stop-color="#0D152B"/>
      <stop offset="1" stop-color="#0A1124"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B76FF"/>
      <stop offset="1" stop-color="#3A50D6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5B76FF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8FA6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FA6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A9FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="1040" cy="20" rx="470" ry="280" fill="url(#glowA)"/>
  <ellipse cx="120" cy="330" rx="320" ry="200" fill="url(#glowB)"/>
  <rect x="0" y="318" width="1280" height="1" fill="url(#hair)"/>

  <!-- right-side decor: sonar arcs + drive mark -->
  <g fill="none" stroke="#8FA6FF">
    <circle cx="1076" cy="160" r="186" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="1076" cy="160" r="138" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="1076" cy="160" r="92" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="1076" cy="160" r="4" fill="#8FA6FF" fill-opacity="0.5" stroke="none"/>
  </g>
  <g transform="rotate(-14 1076 160)" fill="none" stroke="#A9BAFF">
    <rect x="1022" y="139" width="86" height="42" rx="10" stroke-opacity="0.32" stroke-width="1.6"/>
    <rect x="1108" y="150" width="20" height="20" rx="4" stroke-opacity="0.22" stroke-width="1.4"/>
    <path d="M1094 148v24" stroke-opacity="0.18" stroke-width="1.2"/>
    <circle cx="1044" cy="160" r="3.5" fill="#A9BAFF" fill-opacity="0.45" stroke="none"/>
  </g>

  <!-- logo tile -->
  <g>
    <rect x="96" y="118" width="112" height="112" rx="30" fill="#4D6BFE" opacity="0.35" filter="url(#soft)"/>
    <rect x="96" y="118" width="112" height="112" rx="30" fill="url(#tile)"/>
    <rect x="96.75" y="118.75" width="110.5" height="110.5" rx="29.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="152" y="188" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">DSH</text>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Helvetica, Arial, sans-serif">
    <text x="248" y="160" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#F4F7FF">DSH Desktop Portable</text>
    <text x="250" y="196" font-size="19.5" fill="#9FB0D0" letter-spacing="0.2">DeepSeek Harness · Windows x64 · Unzip and run, data stays on the drive</text>

    <!-- chips -->
    <g>
      <rect x="250" y="218" width="134" height="30" rx="15" fill="url(#chip)" stroke="#8FA6FF" stroke-opacity="0.35"/>
      <text x="317" y="238" text-anchor="middle" font-size="13.5" fill="#C9D6F2">ZERO-INSTALL</text>

      <rect x="396" y="218" width="124" height="30" rx="15" fill="url(#chip)" stroke="#8FA6FF" stroke-opacity="0.35"/>
      <text x="458" y="238" text-anchor="middle" font-size="13.5" fill="#C9D6F2">NO REGISTRY</text>

      <rect x="532" y="218" width="166" height="30" rx="15" fill="url(#chip)" stroke="#8FA6FF" stroke-opacity="0.35"/>
      <text x="615" y="238" text-anchor="middle" font-size="13.5" fill="#C9D6F2">SHA-256 VERIFIED</text>
    </g>

    <text x="1184" y="292" text-anchor="end" font-size="12" letter-spacing="3" fill="#9FB0D0" fill-opacity="0.5">UNOFFICIAL BUILD</text>
  </g>
</svg>


