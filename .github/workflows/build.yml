name: build-portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build, or "latest"'
        required: false
        default: latest
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag pins the payload version; only manual runs fall back to the feed.
      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
            } else {
              $version = 'latest'
            }
          }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version: $version"

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build.ps1 -Version $env:BUILD_VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-portable-win-x64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $version = $tag -replace '^v', ''
          $notes = (@(
            "Portable Windows x64 build of DeepSeek Harness ${version}.",
            "",
            "- Built from the official DeepSeek Harness installer; its Authenticode signature was verified before extraction.",
            "- The payload is patched so every writable path stays next to the executable.",
            "- Compare the SHA-256 of the downloaded zip with the attached .sha256 file.",
            "- Unofficial build: not affiliated with or supported by DeepSeek.",
            "",
            "See README.md for usage and CHANGELOG.md for the change list."
          ) -join "`n")
          $arguments = @('release', 'create', $tag) + @(Get-ChildItem dist/*.zip, dist/*.sha256 | ForEach-Object { $_.FullName })
          # Every build here is a release candidate, and GitHub treats "latest" and
          # "pre-release" as mutually exclusive. Point "latest" at the newest build so
          # /releases/latest and the Releases page always offer the current download.
          $arguments += @('--title', $tag, '--notes', $notes, '--latest')
          gh @arguments
