name: build-portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build, or "latest"'
        required: false
        default: latest
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      BUILD_VERSION: ${{ github.event.inputs.version || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build.ps1 -Version $env:BUILD_VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-portable-win-x64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          gh release create $tag dist/*.zip dist/*.sha256 --title $tag --notes "Portable build produced from the official DeepSeek Harness installer."
