name: upstream-check

# Verifies that the patch anchors still match the newest official payload.
# Runs weekly and on demand; it does not publish anything.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve, verify and patch the latest official payload
        shell: pwsh
        run: ./scripts/build.ps1 -Version latest -NoArchive
